<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="ІС-32 Рудих Кароліна">
    <link rel="stylesheet" href="style.css">
    <title>Магазин</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html"><img src="./images/logo2.png" alt=""></a>
            <div>
                <a href="index.html">Головна</a>
                <a href="styles.html">Стилі інтер'єру</a>
                <a href="tips.html">Корисні поради</a>
                <a href="shop.html" class="active">Магазин</a>
                <a href="contacts.html">Контакти</a>
            </div>
            <div id="authNav"></div>
        </nav>
    </header>

    <main>
        <section class="shop-hero">
            <img class="intro-back" src="./images/interior-design-ideas-of-2022-banner-2.jpg" alt="">
            <div class="shop-hero-content">
                <h1>Інтернет-магазин декору та затишку</h1>
                <p>
                    Обирайте стильні товари для інтер’єру, переглядайте детальну інформацію та керуйте каталогом.
                </p>
                <div class="shop-hero-actions">
                    <a href="product-form.html" id="addProductBtn" class="shop-main-btn" data-admin-only>Додати товар</a>
                    <a href="category-form.html" id="addCategoryBtn" class="shop-secondary-btn" data-admin-only>Додати категорію</a>
                </div>
            </div>
        </section>

        <section class="item-back shop-catalog-back">
            <div class="w-container shop-catalog">
                <div class="shop-toolbar">
                    <h2>Каталог товарів</h2>
                    <div id="categories" class="shop-filters"></div>
                </div>

                <div id="products" class="shop-products-grid"></div>
            </div>
        </section>
    </main>

    <script src="auth-ui.js"></script>
    <script src="shop.js"></script>
</body>
</html>
