<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="ІС-32 Рудих Кароліна">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Форма категорії</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html"><img src="./images/logo2.png" alt=""></a>
            <div>
                <a href="index.html">Головна</a>
                <a href="styles.html">Стилі інтер'єру</a>
                <a href="tips.html">Корисні поради</a>
                <a href="shop.html" class="active">Магазин</a>
                <a href="contacts.html">Контакти</a>
            </div>
            <div id="authNav"></div>
        </nav>
    </header>

    <main>
        <section class="item-back form-page-back">
            <div class="w-container form-page category-form-page">
                <div class="form-page-header">
                    <h1 id="categoryFormTitle">Додати категорію</h1>
                    <p>Створіть нову категорію для каталогу товарів.</p>
                </div>

                <form id="categoryForm" class="shop-form">
                    <label for="categoryName">Назва категорії</label>
                    <input type="text" id="categoryName" required>

                    <div class="form-actions">
                        <button type="submit" class="shop-main-btn">Зберегти</button>
                        <a href="shop.html" class="shop-secondary-btn">Скасувати</a>
                    </div>
                </form>

                <div class="categories-admin">
                    <h2>Існуючі категорії</h2>
                    <div id="categoryList" class="category-admin-list"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-main">
            <div>
                <img src="./images/logo2.png" alt="">
                <p class="copyright">
                    © 2025 LUME. All Rights Reserved.<br>Made by KarolinaRM
                </p>
            </div>
            <div class="footer-links">
                <a class="footer-link" href="./styles.html">Стилі інтер’єру</a>
                <a class="footer-link" href="./tips.html">Корисні поради</a>
                <a class="footer-link" href="./contacts.html">Зв’язатися з нами</a>
            </div>
        </div>
    </footer>

    <script src="category-form.js"></script>
</body>
<script src="auth-ui.js"></script>
</html>
